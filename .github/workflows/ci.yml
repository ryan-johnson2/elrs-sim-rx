name: CI

# Publishing, see docs/WEBUI.md "Hosting":
#   tag v* (on main)   -> GitHub release with the firmware and page; this is the release build
#   push to devel      -> rolling "devel-build" prerelease, replaced every time
#   either of those    -> GitHub Pages rebuilt from the latest release plus the devel build
# Pushes to main without a tag are built and tested only.
on:
  push:
    branches: [main, devel]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware build + host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version is worked out from the tags and history

      - name: Cache toolchain image
        id: cache-image
        uses: actions/cache@v4
        with:
          path: /tmp/toolchain-image.tar
          key: toolchain-${{ hashFiles('tools/Dockerfile') }}

      - name: Load or build toolchain image
        run: |
          if [ -f /tmp/toolchain-image.tar ]; then
            docker load -i /tmp/toolchain-image.tar
          else
            docker build -t elrs-sim-rx-build tools/
            docker save elrs-sim-rx-build -o /tmp/toolchain-image.tar
          fi

      - name: Host unit tests
        run: tools/test.sh

      - name: Build firmware
        run: tools/build.sh

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/build/elrs_sim_rx.uf2
            firmware/build/elrs_sim_rx.elf
            firmware/build/elrs_sim_rx_lite.uf2
            firmware/build/elrs_sim_rx_lite.elf
            firmware/build/manifest.json

  web:
    name: Web UI + PICOBOOT tests
    runs-on: ubuntu-latest
    needs: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware/build
      - name: Run web tests
        run: tools/test-web.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshots
          path: tests/web/shots/

  release:
    name: Publish release build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [firmware, web]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware/build
      - name: Check the firmware carries the tag's version
        run: |
          built=$(jq -r '.files[0].version' firmware/build/manifest.json)
          want="${GITHUB_REF_NAME#v}"
          if [ "$built" != "$want" ]; then
            echo "::error::firmware reports $built but the tag is $GITHUB_REF_NAME (tags must look like v1.2.3)"
            exit 1
          fi
      - name: Package the page
        run: tar czf web.tar.gz -C web .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware/build/elrs_sim_rx.uf2
            firmware/build/elrs_sim_rx_lite.uf2
            firmware/build/manifest.json
            web.tar.gz
          generate_release_notes: true

  devel:
    name: Publish development build
    if: github.event_name == 'push' && github.ref == 'refs/heads/devel'
    runs-on: ubuntu-latest
    needs: [firmware, web]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware/build
      - name: Replace the rolling devel-build prerelease
        run: |
          tar czf web.tar.gz -C web .
          git tag -f devel-build
          git push -f origin devel-build
          gh release view devel-build >/dev/null 2>&1 || gh release create devel-build --prerelease \
            --title "Development build" --notes "Rolling build of the devel branch. Replaced on every push."
          gh release upload devel-build --clobber \
            firmware/build/elrs_sim_rx.uf2 firmware/build/elrs_sim_rx_lite.uf2 firmware/build/manifest.json web.tar.gz

  pages:
    name: Publish GitHub Pages
    # Runs after whichever of release / devel ran. The github-pages environment must allow
    # deployments from the devel branch and from v* tags (repo Settings > Environments).
    if: >-
      always() && github.event_name == 'push' &&
      (needs.release.result == 'success' || needs.devel.result == 'success')
    runs-on: ubuntu-latest
    needs: [release, devel]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the latest release and the devel build
        run: |
          mkdir -p chan/release chan/devel
          # "gh release view" with no tag is the latest full release, never a prerelease
          if tag=$(gh release view --json tagName -q .tagName 2>/dev/null); then
            gh release download "$tag" --dir chan/release --pattern '*.uf2' --pattern manifest.json --pattern web.tar.gz
          fi
          gh release download devel-build --dir chan/devel --pattern '*.uf2' --pattern manifest.json --pattern web.tar.gz || true
      - name: Assemble site
        run: |
          tools/assemble_site.py --out site --release chan/release --devel chan/devel
          # Custom domain: set CNAME in repo variable PAGES_CNAME, or leave unset.
          if [ -n "${{ vars.PAGES_CNAME }}" ]; then echo "${{ vars.PAGES_CNAME }}" > site/CNAME; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # deploy-pages looks the artifact up through the API, which can lag the upload by a few
      # seconds when both run in one job (actions/deploy-pages#451). Wait, and retry once.
      - run: sleep 15
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
