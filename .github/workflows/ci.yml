name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware build + host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # manifest records the commit

      - name: Cache toolchain image
        id: cache-image
        uses: actions/cache@v4
        with:
          path: /tmp/toolchain-image.tar
          key: toolchain-${{ hashFiles('tools/Dockerfile') }}

      - name: Load or build toolchain image
        run: |
          if [ -f /tmp/toolchain-image.tar ]; then
            docker load -i /tmp/toolchain-image.tar
          else
            docker build -t elrs-sim-rx-build tools/
            docker save elrs-sim-rx-build -o /tmp/toolchain-image.tar
          fi

      - name: Host unit tests
        run: tools/test.sh

      - name: Build firmware
        run: tools/build.sh

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/build/elrs_sim_rx.uf2
            firmware/build/elrs_sim_rx.elf
            firmware/build/manifest.json

  web:
    name: Web UI + PICOBOOT tests
    runs-on: ubuntu-latest
    needs: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware/build
      - name: Run web tests
        run: tools/test-web.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshots
          path: tests/web/shots/

  pages:
    name: Publish web UI to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [firmware, web]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware/build
      - name: Assemble site
        run: |
          mkdir -p site/firmware
          cp web/* site/
          cp firmware/build/elrs_sim_rx.uf2 firmware/build/manifest.json site/firmware/
          # Custom domain: set CNAME in repo variable PAGES_CNAME, or leave unset.
          if [ -n "${{ vars.PAGES_CNAME }}" ]; then echo "${{ vars.PAGES_CNAME }}" > site/CNAME; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: Attach firmware to release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [firmware, web]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware/elrs_sim_rx.uf2
            firmware/manifest.json
          generate_release_notes: true
